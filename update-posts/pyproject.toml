[project]
name = "update-posts"
version = "0.1.0"
description = "Takes data from google sheets and process it into Hugo posts"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ruff>=0.15.12",
    "gspread>=6.0",
    "google-auth>=2.0",
    "python-dotenv>=1.0",
    "pydantic-settings>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["sheets_to_hugo"]
