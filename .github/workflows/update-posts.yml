name: Update Posts from Google Sheets

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  
concurrency:
  group: update-posts
  cancel-in-progress: true

jobs:
  update-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install UV
        uses: astral-sh/setup-uv@v7

      - name: Run sheets_to_hugo
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CONTENT_DIR: ../content/post
        working-directory: ./update-posts
        run: uv run python sheets_to_hugo.py

      - name: Check for changes
        id: git-check
        run: |
          git add content/post/
          if git diff --cached --quiet; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.has-changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update posts from Google Sheet"
          git push

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.131.0'
          extended: true

      - name: Build Hugo
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: gayslist-demo.zzbottom.gay
